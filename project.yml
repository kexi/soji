name: Soji

options:
  bundleIdPrefix: dev.kexi.soji
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SojiKit:
    path: SojiKit

targets:
  Soji:
    type: application
    platform: macOS
    sources:
      - path: Soji
    info:
      path: Soji/App/Info.plist
      properties:
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Kei Nakayama"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kexi.soji
        PRODUCT_NAME: Soji
        DEVELOPMENT_TEAM: M299C649NZ
        CODE_SIGN_STYLE: Automatic

        # Why not sandbox: 掃除対象の ~/.cargo ~/go ~/.gradle 等は home 直下に
        # 散らばっており、sandbox 下では NSOpenPanel でユーザーに 1 つずつ
        # 選ばせない限り到達できない。しかも MAC が別レイヤーで効くため親の
        # 許可が子に継承されず、~/Library を選ばせても配下に届かない。
        # Developer ID 署名 + notarize での配布を前提に sandbox は無効にする。
        # (~/Library/Caches と DerivedData は TCC 非保護なので権限も不要)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

        SWIFT_VERSION: "6.0"
        # Why MainActor here: app ターゲットは View と ViewModel だけなので
        # MainActor 既定が正しい。重い走査と削除は SojiKit 側にあり、そちらは
        # nonisolated 既定 + @concurrent で並行 executor に逃がしてある。
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete

        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SojiKit

schemes:
  Soji:
    build:
      targets:
        Soji: all
    run:
      config: Debug
    archive:
      config: Release
